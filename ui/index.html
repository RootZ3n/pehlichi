function humanizeToken(text){const raw=String(text||'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim();if(!raw)return'General';return raw.replace(/\b\w/g,(m)=>m.toUpperCase())}

// ── Registry lookups ─────────────────────────────────────────────────
function pehProduct(id){return PRODUCT_REGISTRY.find((p)=>p.id===id)||null}
function pehPublicProducts(){return PRODUCT_REGISTRY.filter((p)=>p.status==='public').sort((a,b)=>a.order-b.order)}
function pehFutureProducts(){return PRODUCT_REGISTRY.filter((p)=>p.status==='future').sort((a,b)=>a.order-b.order)}
function pehScenes(productId){return SCENE_REGISTRY[productId]||[]}
function pehScene(productId,sceneId){return pehScenes(productId).find((s)=>s.id===sceneId)||null}
function pehWorkspaceDef(defId){return WORKSPACE_REGISTRY[defId]||null}

// ── Product isolation ────────────────────────────────────────────────
function pehDevMode(){
  try{
    if(typeof window!=='undefined'&&window.PEHVERSE_DEV===true)return true;
    if(typeof location!=='undefined'&&/[?&]peh-dev=1(?:&|$)/.test(location.search||'')){
      try{localStorage.setItem('pehverse-dev','1')}catch(e){}
    }
    return (typeof localStorage!=='undefined'&&localStorage.getItem('pehverse-dev')==='1');
  }catch(e){return false}
}
function pehResolveActiveProduct(){
  let injected=null,devSel=null;
  try{injected=(typeof window!=='undefined'&&window.PEHVERSE_PRODUCT)||null}catch(e){}
  try{devSel=pehDevMode()?localStorage.getItem('pehverse-product'):null}catch(e){}
  const want=injected||devSel||PEH_DEFAULT_PRODUCT;
  const p=pehProduct(want);
  return (p&&p.status==='public')?p.id:PEH_DEFAULT_PRODUCT;
}
function pehActiveProduct(){
  const p=pehProduct(state.pehverse.product);
  return (p&&p.status==='public')?p:pehProduct(PEH_DEFAULT_PRODUCT);
}
function pehActiveProductId(){const p=pehActiveProduct();return p?p.id:PEH_DEFAULT_PRODUCT}
// Single source for "Peh's portrait for the active product". Each product ships
// its own mascotArt in PRODUCT_REGISTRY; everything that draws Peh reads through
// here so a product swap re-skins Peh in one place. Mirrored onto window so the
// live layer (app.js / peh-guide.js) can reach it too.
const PEH_MASCOT_FALLBACK='assets/peh-hedge-knight.png';
function pehMascotSrc(){const p=pehActiveProduct();return (p&&p.mascotArt)||PEH_MASCOT_FALLBACK;}
if(typeof window!=='undefined')window.pehMascotSrc=pehMascotSrc;
function pehCurrentScene(){
  const p=pehActiveProduct(); if(!p)return null;
  const sid=state.pehverse.scene||p.defaultScene;
  return pehScene(p.id,sid)||pehScenes(p.id)[0]||null;
}
function pehInitProduct(){
  const pid=pehResolveActiveProduct();
  state.pehverse.product=pid;
  const prod=pehProduct(pid);
  if(!state.pehverse.scene||!pehScene(pid,state.pehverse.scene)){
    state.pehverse.scene=(prod&&prod.defaultScene)||(pehScenes(pid)[0]&&pehScenes(pid)[0].id)||null;
  }
}
function pehWorkspaceBelongsToActive(def){
  if(!def)return false;
  return def.product==null||def.product===pehActiveProductId();
}

// ── Navigation ───────────────────────────────────────────────────────
function pehSetScene(sceneId){
  if(!pehScene(pehActiveProductId(),sceneId))return;
  state.pehverse.scene=sceneId;
  state.pehverse.pehPosition=null;
  localStorage.setItem('pehverse-scene',sceneId);
  render();
}
function pehGoScene(sceneId){
  if(!pehScene(pehActiveProductId(),sceneId))return;
  state.pehverse.scene=sceneId;
  state.pehverse.pehPosition=null;
  state.pehverse.fastTravel=false;
  localStorage.setItem('pehverse-scene',sceneId);
  render();
}
function pehDevSwitchProduct(productId){
  if(!pehDevMode())return;
  const p=pehProduct(productId);
  if(!p||p.status!=='public')return;
  state.pehverse.product=p.id;
  state.pehverse.scene=p.defaultScene||(pehScenes(p.id)[0]&&pehScenes(p.id)[0].id)||null;
  state.pehverse.workspaces=[];
  state.pehverse.focus=null;
  state.pehverse.pehBubble=null;
  state.pehverse.pehPosition=null;
  state.pehverse.fastTravel=false;
  try{localStorage.setItem('pehverse-product',p.id);if(state.pehverse.scene)localStorage.setItem('pehverse-scene',state.pehverse.scene)}catch(e){}
  render();
}
// Mode flip is a TRANSFORMATION, not a swap: dashboard mode assembles the full
// Voltron wall (pehEnsureAllOpen), the map returns CLEAN (no stacked windows).
// The morph is done with the View Transitions API so each panel carries a stable
// view-transition-name and the browser animates window⇄tile.
function pehSetMode(mode){
  if(mode!=='immersive'&&mode!=='dashboard')return;
  pehMorph(()=>{
    state.pehverse.mode=mode;
    if(mode==='dashboard')pehEnsureAllOpen();      // dashboard assembles the full cockpit
    else{state.pehverse.workspaces=[];}            // Map returns CLEAN — no stacked windows
    state.pehverse.focus=null;
    try{localStorage.setItem('pehverse-mode',mode)}catch(e){}
    render();
  });
}
// Run a state change inside a View Transition when available; otherwise apply it.
function pehMorph(fn){
  try{ if(typeof document!=='undefined'&&typeof document.startViewTransition==='function'){ document.startViewTransition(fn); return; } }catch(e){}
  fn();
}
// The product's dashboard panels, ordered by PANEL_META.priority.
function pehProductPanelIds(){
  return Object.keys(PANEL_META)
    .filter((id)=>{const d=WORKSPACE_REGISTRY[id];return d&&pehWorkspaceBelongsToActive(d);})
    .sort((a,b)=>(pehPanelMeta(a).priority||99)-(pehPanelMeta(b).priority||99));
}
function pehHotspotForPanel(defId){
  for(const s of pehScenes(pehActiveProductId())){
    const h=(s.hotspots||[]).find((x)=>x.workspace===defId);
    if(h)return h;
  }
  return null;
}
// Open every product panel not already open, seeding each window's position from
// its hotspot so the reverse morph (dashboard → map) scatters them back home.
function pehEnsureAllOpen(){
  for(const id of pehProductPanelIds()){
    if(state.pehverse.workspaces.find((w)=>w.defId===id))continue;
    const def=WORKSPACE_REGISTRY[id]||{};
    const ws={uid:'ws'+(++state.pehverse.wsSeq),defId:id,dock:(def.dock||'right'),min:false};
    const h=pehHotspotForPanel(id);
    if(h){ws.x=h.x;ws.y=h.y;}
    state.pehverse.workspaces.push(ws);
  }
}
// Pack-tight row plan: split n tiles into balanced rows so the wall fills with
// no holes. n=9 → [3,3,3]; n=4 → [2,2]; n=2 → [2]; n=1 → [1].
function pehPackRows(n){
  if(n<=1)return[n];
  const cols=Math.ceil(Math.sqrt(n));
  const rows=Math.ceil(n/cols);
  const base=Math.floor(n/rows), extra=n%rows;
  const out=[]; for(let r=0;r<rows;r++)out.push(base+(r<extra?1:0));
  return out;
}
function pehToggleMode(){pehSetMode(state.pehverse.mode==='immersive'?'dashboard':'immersive')}
function pehToggleFastTravel(force){
  state.pehverse.fastTravel=(typeof force==='boolean')?force:!state.pehverse.fastTravel;
  render();
}

// ── WorkspaceManager: open/close/dock/focus/minimize ─────────────────
function pehOpenWorkspace(defId,opts){
  const def=pehWorkspaceDef(defId); if(!def)return;
  if(!pehWorkspaceBelongsToActive(def)){
    if(typeof console!=='undefined'&&console.warn){
      console.warn('[pehverse] blocked cross-product workspace open:',defId,'(owned by',def.product,'· active',pehActiveProductId()+')');
    }
    return;
  }
  let ws=state.pehverse.workspaces.find((w)=>w.defId===defId);
  if(!ws){
    ws={uid:'ws'+(++state.pehverse.wsSeq),defId,dock:(opts&&opts.dock)||def.dock||'right',min:false};
    state.pehverse.workspaces.push(ws);
  }
  ws.min=false;
  pehFocusWorkspace(ws.uid,true);
  render();
}
// Open a workspace window positioned at a specific map location (x/y %).
// Called when a hotspot pin is clicked so the panel pops up next to Peh.
// De-dupes: if already open, just focus it (don't move it back).
function pehOpenWorkspaceAt(defId,x,y){
  const def=pehWorkspaceDef(defId); if(!def)return;
  if(!pehWorkspaceBelongsToActive(def))return;
  let ws=state.pehverse.workspaces.find((w)=>w.defId===defId);
  if(ws){pehFocusWorkspace(ws.uid);return}
  const sx=x!=null?x:50, sy=y!=null?y:50;
  ws={uid:'ws'+(++state.pehverse.wsSeq),defId,x:sx,y:sy,min:false};
  state.pehverse.workspaces.push(ws);
  state.pehverse.focus=ws.uid;
  render();
}

// ── Peh-as-guide: contextual speech bubble ────────────────────────────
let pehBubbleFadeTimer=null;
let pehBubbleClearTimer=null;
const PEH_BUBBLE_HOLD_MS=6000;
const PEH_BUBBLE_FADE_MS=300;
function pehClearBubbleTimers(){
  if(pehBubbleFadeTimer){clearTimeout(pehBubbleFadeTimer);pehBubbleFadeTimer=null;}
  if(pehBubbleClearTimer){clearTimeout(pehBubbleClearTimer);pehBubbleClearTimer=null;}
}
function pehBubbleAnchor(hotspot){return (hotspot.y!=null&&hotspot.y<24)?'down':'up';}
function pehSayGreeting(hotspot,scene){
  if(!hotspot)return;
  const text=hotspot.greeting||(scene?`Welcome to ${scene.title}.`:'This way!');
  const x=Math.max(16,Math.min(84,hotspot.x!=null?hotspot.x:50));
  const y=hotspot.y!=null?hotspot.y:50;
  pehClearBubbleTimers();
  state.pehverse.pehBubble={
    text,x,y,
    anchor:pehBubbleAnchor(hotspot),
    variant:(scene&&scene.pehSlot&&scene.pehSlot.variant)||'guide',
    hotspotId:hotspot.id,
    phase:'enter'
  };
  state.pehverse.pehPosition={x:hotspot.x!=null?hotspot.x:50,y};
  render();
  pehBubbleFadeTimer=setTimeout(()=>{
    pehBubbleFadeTimer=null;
    if(!state.pehverse.pehBubble||state.pehverse.pehBubble.hotspotId!==hotspot.id)return;
    state.pehverse.pehBubble.phase='exit';
    render();
    pehBubbleClearTimer=setTimeout(()=>{
      pehBubbleClearTimer=null;
      if(state.pehverse.pehBubble&&state.pehverse.pehBubble.hotspotId===hotspot.id){
        state.pehverse.pehBubble=null;
        render();
      }
    },PEH_BUBBLE_FADE_MS);
  },PEH_BUBBLE_HOLD_MS);
}
function pehDismissBubble(){
  if(!state.pehverse.pehBubble)return;
  pehClearBubbleTimers();
  state.pehverse.pehBubble.phase='exit';
  render();
  pehBubbleClearTimer=setTimeout(()=>{
    pehBubbleClearTimer=null;
    state.pehverse.pehBubble=null;
    render();
  },PEH_BUBBLE_FADE_MS);
}
function pehHotspot(defId,sceneId){
  if(sceneId&&pehScene(pehActiveProductId(),sceneId)){
    state.pehverse.scene=sceneId;state.pehverse.pehPosition=null;localStorage.setItem('pehverse-scene',sceneId);
  }
  pehOpenWorkspace(defId);
}
function pehHotspotActivate(sceneId,hotspotId){
  const scene=pehScene(pehActiveProductId(),sceneId);
  const hotspot=scene&&scene.hotspots?scene.hotspots.find((h)=>h.id===hotspotId):null;
  if(!hotspot)return;
  // Peh greets at the hotspot FIRST, then — after a short beat — the workspace
  // pops up as a movable window beside the pin (or we travel to a sub-scene).
  pehSayGreeting(hotspot,scene);
  setTimeout(()=>{
    if(hotspot.workspace){
      if(hotspot.scene&&pehScene(pehActiveProductId(),hotspot.scene)){
        state.pehverse.scene=hotspot.scene;state.pehverse.pehPosition=null;
        try{localStorage.setItem('pehverse-scene',hotspot.scene)}catch(e){}
      }
      state.pehverse.pehPopUp={x:hotspot.x,y:hotspot.y};
      pehOpenWorkspaceAt(hotspot.workspace,hotspot.x,hotspot.y);
    }else if(hotspot.scene){
      pehSetScene(hotspot.scene);
    }
  },300);
}
function pehFocusWorkspace(uid,skipRender){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid);
  if(!ws){if(!skipRender)render();return}
  state.pehverse.focus=uid;
  const def=pehWorkspaceDef(ws.defId);
  if(def&&def.kind==='lane'&&def.tab)state.activeTab=def.tab;
  state.pehverse.workspaces=state.pehverse.workspaces.filter((w)=>w.uid!==uid).concat(ws);
  if(!skipRender)render();
}
function pehCloseWorkspace(uid){
  state.pehverse.workspaces=state.pehverse.workspaces.filter((w)=>w.uid!==uid);
  if(state.pehverse.focus===uid){
    const stack=state.pehverse.workspaces;
    state.pehverse.focus=stack.length?stack[stack.length-1].uid:null;
  }
  render();
}
function pehDockWorkspace(uid,dock){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid); if(!ws)return;
  ws.dock=dock; ws.min=false; pehFocusWorkspace(uid,true); render();
}
function pehMinimizeWorkspace(uid){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid); if(!ws)return;
  ws.min=!ws.min; render();
}
function pehCloseAllWorkspaces(){
  state.pehverse.workspaces=[]; state.pehverse.focus=null; render();
}
function pehBackToMap(uid){
  if(uid)state.pehverse.workspaces=state.pehverse.workspaces.filter((w)=>w.uid!==uid);
  const stack=state.pehverse.workspaces;
  state.pehverse.focus=stack.length?stack[stack.length-1].uid:null;
  state.pehverse.mode='immersive';
  try{localStorage.setItem('pehverse-mode','immersive')}catch(e){}
  render();
}

// ── Positioned workspace windows (map overlay) — movable, draggable ────
// Each open workspace renders as a draggable panel pinned beside its hotspot.
// Console-class panels carry a ⤢ Console button that expands the window into a
// large centred workspace. view-transition-name ties the window to its tile.
function renderWorkspaceWindows(deckMarkup){
  const open=state.pehverse.workspaces;
  if(!open.length)return'';
  return `<div class="peh-ws-windows">${open.map((w)=>{
    const def=pehWorkspaceDef(w.defId)||{};
    const meta=pehPanelMeta(w.defId);
    const solo=meta.solo||{};
    const x=w.x!=null?w.x:50;
    const y=w.y!=null?w.y:50;
    const focused=state.pehverse.focus===w.uid;
    const z=focused?25:15;
    const isConsoleClass=!!meta.console;
    const consoleOn=isConsoleClass&&w.console;
    let wStyle,hStyle,posStyle;
    if(consoleOn){
      wStyle='width:min(1040px,94vw)';
      hStyle=';height:min(82vh,720px);max-height:calc(100% - 18px)';
      posStyle='left:50%;top:50%;transform:translate(-50%,-50%);right:auto;bottom:auto';
    }else{
      wStyle=solo.w?`width:${solo.w}`:'width:min(460px,44vw)';
      hStyle=';max-height:calc(100% - 28px)';
      if(w.moved){
        posStyle=`left:${x}%;top:${y}%`;
      }else{
        const hPos=x<50?'left:14px;right:auto':'right:14px;left:auto';
        const vPos=y<50?'top:14px;bottom:auto':'bottom:14px;top:auto';
        posStyle=`${hPos};${vPos}`;
      }
    }
    const consoleBtn=isConsoleClass?`<button class="peh-ws-console" type="button" title="${consoleOn?'Shrink to card':'Open the full console'}" aria-label="${consoleOn?'Shrink to card':'Open the full console'}" onclick="event.stopPropagation();pehToggleConsole('${w.uid}')">${consoleOn?'▢ Card':'⤢ Console'}</button>`:'';
    return `<div class="peh-ws-window solo ${focused?'focused':''} ${consoleOn?'console':''}" data-uid="${w.uid}" style="${posStyle};z-index:${z};${wStyle}${hStyle};view-transition-name:peh-panel-${w.defId}" onmousedown="pehFocusWorkspace('${w.uid}')">
      <div class="peh-ws-header" onmousedown="event.stopPropagation();pehDragStart(event,'${w.uid}')">
        <span class="peh-ws-glyph">${pehGlyph(def.peh)}</span>
        <span class="peh-ws-title">${esc(def.title||w.defId)}</span>
        ${consoleBtn}
        <button class="peh-ws-close" onclick="event.stopPropagation();pehCloseWorkspace('${w.uid}')">×</button>
      </div>
      <div class="peh-ws-body">${pehWorkspaceBody(w,deckMarkup)}</div>
    </div>`;
  }).join('')}</div>`;
}

// ── Drag handling for workspace windows ─────────────────────────────────
let __pehDrag=null;
function pehDragStart(e,uid){
  e.preventDefault();e.stopPropagation();
  if(e.target.closest('.peh-ws-close,.peh-ws-console'))return;
  const win=e.target.closest('.peh-ws-window');if(!win)return;
  const scene=win.closest('.peh-scene');if(!scene)return;
  pehFocusWorkspace(uid,true);
  __pehDrag={uid,win,scene,startMouseX:e.clientX,startMouseY:e.clientY,startWinX:win.offsetLeft,startWinY:win.offsetTop};
  document.addEventListener('mousemove',pehDragMove);
  document.addEventListener('mouseup',pehDragEnd);
}
function pehDragMove(e){
  if(!__pehDrag)return;
  const dx=e.clientX-__pehDrag.startMouseX;
  const dy=e.clientY-__pehDrag.startMouseY;
  __pehDrag.win.style.left=(__pehDrag.startWinX+dx)+'px';
  __pehDrag.win.style.top=(__pehDrag.startWinY+dy)+'px';
}
function pehDragEnd(e){
  if(!__pehDrag)return;
  const ws=state.pehverse.workspaces.find((w)=>w.uid===__pehDrag.uid);
  if(ws){
    const sceneRect=__pehDrag.scene.getBoundingClientRect();
    const winRect=__pehDrag.win.getBoundingClientRect();
    ws.x=((winRect.left-sceneRect.left)/sceneRect.width)*100;
    ws.y=((winRect.top-sceneRect.top)/sceneRect.height)*100;
    ws.moved=true;
  }
  __pehDrag=null;
  document.removeEventListener('mousemove',pehDragMove);
  document.removeEventListener('mouseup',pehDragEnd);
  render();
}
function pehToggleConsole(uid){
  const ws=state.pehverse.workspaces.find((w)=>w.uid===uid); if(!ws)return;
  pehFocusWorkspace(uid,true);
  pehMorph(()=>{ ws.console=!ws.console; render(); });
}

// ── DashboardSurface — the merged Voltron wall over the open windows ────
// In this mode panels are children of this surface, not floating windows: tiles
// pack into balanced hole-free rows (pehPackRows) and share a view-transition-
// name with their window, so the browser morphs window⇄tile when the mode flips.
function renderDashboardSurface(product,scene,deckMarkup){
  const open=state.pehverse.workspaces.filter((w)=>!w.min&&WORKSPACE_REGISTRY[w.defId]);
  if(!open.length)return `<div class="peh-dash-surface" data-mode="dashboard" role="group" aria-label="${esc(product.displayName)} Settlement Grid">
    <header class="peh-dash-bar">
      <button class="peh-backmap" type="button" onclick="pehSetMode('immersive')"><span aria-hidden="true">‹</span> Map</button>
      <span class="peh-dash-bar-title">${esc(product.displayName)} · Settlement Grid</span>
    </header>
    <div style="flex:1 1 auto;display:flex;align-items:center;justify-content:center;color:var(--ink-dim);font-style:italic;text-align:center;padding:24px">All panels are closed — <button type="button" class="peh-backmap" style="margin:0 6px" onclick="pehSetMode('immersive')">return to the map</button> to reopen hotspots.</div>
  </div>`;
  const rows=pehPackRows(open.length);
  let i=0;
  const wall=rows.map((count)=>{
    let cells='';
    for(let k=0;k<count;k++){const w=open[i++];if(w)cells+=renderTransformingPanel(w.defId,'dashboard',deckMarkup);}
    return `<div class="peh-dash-row">${cells}</div>`;
  }).join('');
  return `<div class="peh-dash-surface" data-mode="dashboard" role="group" aria-label="${esc(product.displayName)} Settlement Grid">
    <header class="peh-dash-bar">
      <button class="peh-backmap" type="button" title="Back to the map" aria-label="Back to the world map" onclick="pehSetMode('immersive')"><span aria-hidden="true">‹</span> Map</button>
      <span class="peh-dash-bar-title">${esc(product.displayName)} · Settlement Grid</span>
      <span class="peh-dash-bar-tag">${open.length} panel${open.length===1?'':'s'}</span>
    </header>
    <div class="peh-dash-wall peh-dash-wall-flex">${wall}</div>
  </div>`;
}
// One panel as a borderless Voltron tile. The body flows through pehWorkspaceBody
// (which app.js overrides to inject live data) using a synthetic console:false
// window, so the tile renders the live glance of each panel.
function renderTransformingPanel(defId,mode,deckMarkup){
  const def=WORKSPACE_REGISTRY[defId]||{};
  const meta=pehPanelMeta(defId);
  if(mode==='dashboard'){
    const w={uid:'dash-'+defId,defId,console:false,dash:true};
    return `<section class="peh-dash-tile role-${esc(meta.role||'panel')}" style="view-transition-name:peh-panel-${esc(defId)}" data-panel="${esc(defId)}" aria-label="${esc(def.title||defId)}">
      <header class="peh-dash-tile-head">
        <span class="peh-dash-tile-glyph">${pehGlyph(def.peh)}</span>
        <span class="peh-dash-tile-title">${esc(def.title||defId)}</span>
        <button class="peh-dash-open" type="button" title="Open ${esc(def.title||defId)}" aria-label="Open ${esc(def.title||defId)}" onclick="pehOpenSolo('${esc(defId)}')">⤢</button>
      </header>
      <div class="peh-dash-tile-body">${pehWorkspaceBody(w,deckMarkup)}</div>
    </section>`;
  }
  return '';
}
// Open a single panel in SOLO mode from a dashboard tile: leave the wall, return
// to the map, and pop the panel up beside its own hotspot.
function pehOpenSolo(defId){
  const def=pehWorkspaceDef(defId);if(!def)return;
  state.pehverse.mode='immersive';
  try{localStorage.setItem('pehverse-mode','immersive')}catch(e){}
  state.pehverse.workspaces=[];
  state.pehverse.focus=null;
  const h=pehHotspotForPanel(defId);
  if(h){state.pehverse.pehPopUp={x:h.x,y:h.y};pehOpenWorkspaceAt(defId,h.x,h.y);}
  else{pehOpenWorkspaceAt(defId);}
}

// ── WorkspaceManager: body renderer ────────────────────────────────────
// The inline body handles the deck console + placeholder. app.js loads AFTER

// backend data. renderWorkspaceWindows + renderDashboardSurface both call
// through here, so live content flows to floating windows AND Voltron tiles.
function pehWorkspaceBody(w,deckMarkup){
  const def=pehWorkspaceDef(w.defId); if(!def)return'';
  if(def.kind==='deck')return `<div class="peh-deck-wrap">${deckMarkup}</div>`;
  return pehPlaceholderBody(def);
}
function pehPlaceholderBody(def){
  return `<div class="peh-ph">
    <div class="peh-ph-glyph">${pehGlyph(def.peh)}</div>
    <p class="peh-ph-blurb">${esc(def.blurb||'Workspace loading…')}</p>
    <div class="peh-ph-tag">LOADING · please wait</div>
  </div>`;
}

// ── Taskbar ───────────────────────────────────────────────────────────
function renderPehTaskbar(){

  return `<div class="peh-taskbar" role="toolbar" aria-label="Open workspaces">
    <button class="peh-task-travel" type="button" onclick="pehToggleFastTravel()" title="Fast travel (Alt+T)" aria-label="Fast travel"><span aria-hidden="true">✦</span></button>
    <div class="peh-task-chips">${open.length?open.map((w)=>{
      const def=pehWorkspaceDef(w.defId)||{};
      return `<button class="peh-task-chip ${state.pehverse.focus===w.uid?'active':''} ${w.min?'min':''}" type="button" onclick="pehFocusWorkspace('${w.uid}')" title="${esc(def.title||w.defId)}"><span class="peh-task-glyph">${pehGlyph(def.peh)}</span><span class="peh-task-name">${esc(def.title||w.defId)}</span><span class="peh-task-x" role="button" tabindex="0" title="Close" aria-label="Close ${esc(def.title||w.defId)}" onmousedown="event.stopPropagation()" onclick="event.stopPropagation();pehCloseWorkspace('${w.uid}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();event.stopPropagation();pehCloseWorkspace('${w.uid}')}">×</span></button>`;
    }).join(''):`<span class="peh-task-empty">No open workspaces — tap a hotspot, or ✦ Fast travel.</span>`}</div>
    ${open.length?`<button class="peh-task-clear" type="button" onclick="pehCloseAllWorkspaces()">Close all</button>`:''}
  </div>`;
}

// ── FastTravelMenu ────────────────────────────────────────────────────
function renderFastTravelMenu(){
  if(!state.pehverse.fastTravel)return'';
  const product=pehActiveProduct();
  const here=pehCurrentScene();
  const scenes=pehScenes(product.id);
  return `<div class="peh-ft-overlay" role="dialog" aria-modal="true" aria-label="Fast travel" onclick="if(event.target===this)pehToggleFastTravel(false)">
    <div class="peh-ft">
      <header class="peh-ft-head"><h2>Fast travel</h2><span class="peh-ft-hint">Within ${esc(product.displayName)} · jump to any area</span><button class="peh-ft-close" type="button" onclick="pehToggleFastTravel(false)" aria-label="Close fast travel">×</button></header>
      <div class="peh-ft-scenes peh-ft-scenes-main">${scenes.length?scenes.map((s)=>`<button class="peh-ft-scene ${here&&here.id===s.id?'active':''}" aria-current="${here&&here.id===s.id?'true':'false'}" type="button" onclick="pehGoScene('${s.id}')">${esc(s.title)}</button>`).join(''):`<span class="peh-ft-empty">No additional areas yet.</span>`}</div>
      ${pehDevMode()?renderPehDevSwitcher(product):''}
    </div>
  </div>`;
}
function renderPehDevSwitcher(active){
  const pub=pehPublicProducts();
  const future=pehFutureProducts();
  return `<div class="peh-ft-dev">
    <span class="peh-ft-dev-label">⚙ Dev only · product switcher</span>
    <div class="peh-ft-dev-products">
      ${pub.map((p)=>`<button class="peh-ft-dev-product ${p.id===active.id?'active':''}" type="button" onclick="pehDevSwitchProduct('${p.id}')">${esc(p.displayName)}</button>`).join('')}
      ${future.map((p)=>`<span class="peh-ft-dev-soon">${esc(p.displayName)} · config only</span>`).join('')}
    </div>
  </div>`;
}

// ── Settlement Overview console (the kind:'deck' workspace body) ───────
const PEH_PAST_LIVES=['Hedge Knight','Race Car Driver','Private Eye','Gladiator','Medicine Man','Stone Age Man','Librarian'];
function renderObservatoryConsole(){
  const cards=[
    {ws:'keep-config',       scene:'the-keep',      glyph:'gear',   title:'Coordination Hub',   desc:'Sessions, active conversations, and the dials that keep the settlement running.'},
    {ws:'training-identity', scene:'training-yard', glyph:'leaf',   title:'Agent Network',      desc:'Peer agents, their status, and everyone connected to the Pehverse.'},
    {ws:'armory-tools',      scene:'the-armory',    glyph:'tools',  title:'Diagnostics Bench',  desc:'Tools, system health, uptime, and the water wheel turning.'},
    {ws:'quest-research',    scene:'quest-board',   glyph:'beaker', title:'Research Notes',     desc:'Active sessions, capabilities, and experiments in progress.'},
    {ws:'market-comms',      scene:'market-square', glyph:'signal', title:'Message Board',      desc:'Agent coordination, bridge connections, and the pulse of the settlement.'},
    {ws:'campsite-memory',   scene:'the-campsite',  glyph:'book',   title:'Memory',             desc:'Past lives, campfire stories, and everything ever remembered.'},
    {ws:'chapel-meditation', scene:'the-chapel',    glyph:'spark',  title:'Identity',           desc:'Who Peh is — voice, personality, and the self across every life.'},
    {ws:'study-knowledge',   scene:'the-study',     glyph:'book',   title:'Knowledge Desk',     desc:'Archived knowledge, bridge connections, and what has been learned.'}
  ];
  return `<div class="obs-console">
    <div class="obs-hero">
      <span class="obs-hero-mark" aria-hidden="true">${pehGlyph('star')}</span>
      <div>
        <h2>Welcome to the Settlement</h2>
        <p>I'm Pehlichi — hedge knight, coordinator of this settlement. I study, guide, and remember across every life I've lived. Pick a path below, or tap a location on the map.</p>
      </div>
    </div>
    <h3 class="obs-section-title">Settlement areas</h3>
    <div class="obs-cards">${cards.map((c)=>`
      <button class="obs-card" type="button" onclick="pehHotspot('${c.ws}','${c.scene}')">
        <span class="obs-card-glyph">${pehGlyph(c.glyph)}</span>
        <span class="obs-card-title">${esc(c.title)}</span>
        <span class="obs-card-desc">${esc(c.desc)}</span>
      </button>`).join('')}</div>
    <div class="obs-lives">
      <p>"Every life I've lived taught me something. I carry them all."</p>
      <div class="obs-lives-row">${PEH_PAST_LIVES.map((l)=>`<span class="obs-life">${esc(l)}</span>`).join('')}</div>
    </div>
    <div class="obs-foot">THE SETTLEMENT · Pehlichi · coordinator of the Pehverse</div>
  </div>`;
}

// ── Keyboard shortcuts ────────────────────────────────────────────────
let __pehKeysBound=false;
function pehBindKeys(){
  if(__pehKeysBound)return; __pehKeysBound=true;
  document.addEventListener('keydown',(e)=>{
    if(e.key==='Escape'&&state.pehverse.fastTravel){pehToggleFastTravel(false);return}
    if(e.altKey&&(e.key==='t'||e.key==='T')){e.preventDefault();pehToggleFastTravel()}
    if(e.altKey&&(e.key==='m'||e.key==='M')){e.preventDefault();pehToggleMode()}
  });
}
pehBindKeys();
pehInitProduct();
// If the persisted mode is dashboard, assemble the Voltron wall BEFORE the first
// render — otherwise the dashboard surface shows the empty-cockpit prompt.
if(state.pehverse.mode==='dashboard')pehEnsureAllOpen();

function render(){
  const deckMarkup=renderObservatoryConsole();
  document.getElementById('app').innerHTML=renderPehverse(deckMarkup);
}

// ── Boot ──────────────────────────────────────────────────────────────
function boot(){
  try{
    render();
  }catch(err){
    const app=document.getElementById('app');
    if(app)app.innerHTML='<div style="padding:24px;color:#f3ecdc;font-family:sans-serif">The Settlement could not finish loading. <button onclick="boot()" style="margin-left:8px">Retry</button><pre style="color:#b6a079;white-space:pre-wrap">'+esc(String(err&&err.stack||err))+'</pre></div>';
  }
}
window.boot=boot;
boot();
