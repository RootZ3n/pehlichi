<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0f1614" />
<title>Peh — chat</title>
<style>
  :root{
    --bg:#0f1614; --panel:#141d1a; --panel-2:#1b2723; --line:#243430;
    --text:#e8f0ec; --muted:#8aa398; --accent:#5fce9b; --accent-ink:#06251a;
    --me:#1f3b30; --peh:#182320; --danger:#e0715f; --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    background:var(--bg); color:var(--text); font-family:var(--font);
    display:flex; flex-direction:column; height:100dvh; overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  header{
    display:flex; align-items:center; gap:10px;
    padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;
    background:var(--panel); border-bottom:1px solid var(--line); flex:0 0 auto;
  }
  .avatar{
    width:38px;height:38px;border-radius:50%;flex:0 0 auto;
    display:grid;place-items:center;font-weight:700;font-size:17px;
    background:radial-gradient(circle at 30% 25%, #6fe0ac, #2f8f66); color:var(--accent-ink);
  }
  .who{display:flex;flex-direction:column;min-width:0;flex:1 1 auto}
  .who .name{font-weight:650;font-size:16px;line-height:1.1}
  .who .sub{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .who .sub .dot{color:var(--accent)}
  .hbtn{
    flex:0 0 auto;background:var(--panel-2);color:var(--muted);border:1px solid var(--line);
    border-radius:999px;width:36px;height:36px;font-size:15px;cursor:pointer;display:grid;place-items:center;
  }
  .hbtn:active{color:var(--accent)}
  .modelwrap{position:relative;flex:0 0 auto}
  #model{
    appearance:none;-webkit-appearance:none;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:999px; padding:8px 28px 8px 12px; font-size:13px; font-family:inherit;
    max-width:40vw; text-overflow:ellipsis;
  }
  .modelwrap::after{content:"▾";position:absolute;right:11px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none;font-size:11px}
  #log{
    flex:1 1 auto; overflow-y:auto; padding:16px 12px 8px;
    display:flex; flex-direction:column; gap:10px; scroll-behavior:smooth;
  }
  .row{display:flex;gap:8px;max-width:100%;align-items:flex-end}
  .row.me{flex-direction:row-reverse}
  .bubble{
    max-width:82%; padding:9px 13px; border-radius:var(--radius);
    line-height:1.45; font-size:15px; word-wrap:break-word; white-space:pre-wrap;
    border:1px solid var(--line); position:relative;
  }
  .row.peh .bubble{background:var(--peh); border-bottom-left-radius:5px}
  .row.me .bubble{background:var(--me); border-bottom-right-radius:5px}
  .bubble .nm{display:block;font-size:11px;color:var(--accent);margin-bottom:3px;font-weight:600}
  .row.me .bubble .nm{display:none}
  .bubble em{color:var(--muted);font-style:italic}
  .bubble code{background:#0c1310;border:1px solid var(--line);border-radius:6px;padding:1px 5px;font-size:13px}
  .bubble strong{color:#fff}
  .bubble .thumbs{display:flex;flex-wrap:wrap;gap:6px;margin:2px 0 6px}
  .bubble .thumbs img{max-width:120px;max-height:120px;border-radius:8px;border:1px solid var(--line)}
  .bubble .filechip{display:inline-flex;align-items:center;gap:5px;background:#0c1310;border:1px solid var(--line);border-radius:8px;padding:3px 8px;font-size:12px;color:var(--muted);margin:0 4px 4px 0}
  .meta{display:flex;align-items:center;gap:8px;margin-top:5px;font-size:10px;color:var(--muted)}
  .meta .cost{background:#0c1310;border:1px solid var(--line);border-radius:999px;padding:1px 7px;letter-spacing:.2px}
  .meta .copy{margin-left:auto;background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;padding:2px 4px;line-height:1}
  .meta .copy:active{color:var(--accent)}
  .sys{align-self:center;font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:5px 12px;border-radius:999px;text-align:center}
  .err .bubble{border-color:var(--danger);color:#ffd9d1}
  .typing{display:flex;gap:4px;padding:12px 14px}
  .typing span{width:7px;height:7px;border-radius:50%;background:var(--muted);animation:bl 1.2s infinite}
  .typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}
  @keyframes bl{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
  #tray{display:none;gap:8px;flex-wrap:wrap;padding:8px 12px 0;background:var(--panel)}
  #tray.on{display:flex}
  .tchip{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:4px 6px 4px 4px;font-size:12px;max-width:48%}
  .tchip img{width:34px;height:34px;object-fit:cover;border-radius:6px}
  .tchip .nm{max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
  .tchip .x{cursor:pointer;color:var(--muted);font-size:16px;padding:0 3px}
  form{
    flex:0 0 auto; display:flex; gap:8px; align-items:flex-end;
    padding:8px 10px calc(env(safe-area-inset-bottom) + 8px);
    background:var(--panel); border-top:1px solid var(--line);
  }
  .iconbtn{
    flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);cursor:pointer;
    background:var(--panel-2);color:var(--muted);font-size:19px;display:grid;place-items:center;
  }
  .iconbtn:active{color:var(--accent)}
  #msg{
    flex:1 1 auto; resize:none; max-height:140px; min-height:44px;
    background:var(--panel-2); color:var(--text); border:1px solid var(--line);
    border-radius:22px; padding:11px 15px; font-size:15px; font-family:inherit; line-height:1.35;
  }
  #msg:focus{outline:none;border-color:var(--accent)}
  #send{background:var(--accent);color:var(--accent-ink);border:none;font-size:20px}
  #send:disabled{opacity:.5}
  .toast{
    position:fixed;left:50%;bottom:80px;transform:translateX(-50%);
    background:var(--panel-2);border:1px solid var(--accent);color:var(--text);
    padding:8px 16px;border-radius:999px;font-size:13px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:9;
  }
  .toast.show{opacity:1}
</style>
</head>
<body>
  <header>
    <div class="avatar" id="ava">P</div>
    <div class="who">
      <span class="name" id="agentName">Peh</span>
      <span class="sub"><span class="dot">●</span> <span id="status">connecting…</span></span>
    </div>
    <button class="hbtn" id="copyAll" title="Copy whole conversation">⧉</button>
    <div class="modelwrap"><select id="model" title="Switch model"></select></div>
  </header>

  <div id="log"></div>
  <div class="toast" id="toast"></div>
  <div id="tray"></div>

  <form id="composer">
    <input type="file" id="file" multiple accept="image/*,.pdf,.txt,.md,.markdown,.json,.csv,.log,.xml,.yaml,.yml,.html,.js,.ts,.py" hidden />
    <button class="iconbtn" id="attach" type="button" title="Attach image or document">＋</button>
    <textarea id="msg" placeholder="Message Peh…" rows="1" autocomplete="off"></textarea>
    <button class="iconbtn" id="send" type="submit" title="Send">➤</button>
  </form>

<script>
(function(){
  "use strict";
  var API = location.origin;
  var TOKEN = localStorage.getItem("peh-token") || (window.PEH_TOKEN || "");
  var ROOM = localStorage.getItem("peh-room") || "daily";
  var $ = function(id){return document.getElementById(id);};
  var log=$("log"), form=$("composer"), input=$("msg"), sendBtn=$("send"),
      modelSel=$("model"), statusEl=$("status"), agentNameEl=$("agentName"),
      avaEl=$("ava"), toastEl=$("toast"), fileInput=$("file"), tray=$("tray");
  var AGENT="Peh";
  var pending=[];        // {name,type,dataUrl}
  var convo=[];          // {who,text} for copy-all

  function headers(){var h={"content-type":"application/json"};if(TOKEN)h["authorization"]="Bearer "+TOKEN;return h;}
  function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function fmt(s){
    var t=esc(s);
    t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
    t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
    t=t.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
    t=t.replace(/\bhttps?:\/\/[^\s<]+/g,function(u){return '<a href="'+u+'" target="_blank" rel="noopener" style="color:var(--accent)">'+u+'</a>';});
    return t;
  }
  function nowTs(){return new Date().toLocaleTimeString([],{hour:"2-digit",minute:"2-digit"});}
  function atBottom(){return log.scrollHeight-log.scrollTop-log.clientHeight<120;}
  function scroll(f){if(f||atBottom())log.scrollTop=log.scrollHeight;}
  function toast(m){toastEl.textContent=m;toastEl.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){toastEl.classList.remove("show");},2200);}
  function kfmt(n){return n>=1000?(n/1000).toFixed(n>=10000?0:1)+"k":String(n);}
  function usd(n){return n>=0.01?"$"+n.toFixed(3):"$"+n.toFixed(5).replace(/0+$/,"");}
  function copyText(t){
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(function(){toast("Copied");},function(){fallbackCopy(t);});}
    else fallbackCopy(t);
  }
  function fallbackCopy(t){var a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");toast("Copied");}catch(e){toast("Copy failed");}a.remove();}

  function addSys(text){var d=document.createElement("div");d.className="sys";d.textContent=text;log.appendChild(d);scroll(true);}

  function addMsg(who,text,opts){
    opts=opts||{};
    convo.push({who:who,text:text});
    var row=document.createElement("div");
    row.className="row "+(who==="me"?"me":"peh")+(opts.err?" err":"");
    var b=document.createElement("div"); b.className="bubble";
    var html=(who!=="me"?'<span class="nm">'+esc(AGENT)+'</span>':'');
    if(opts.atts&&opts.atts.length){
      var imgs=opts.atts.filter(function(a){return /^image\//.test(a.type);});
      var docs=opts.atts.filter(function(a){return !/^image\//.test(a.type);});
      if(imgs.length){html+='<div class="thumbs">'+imgs.map(function(a){return '<img src="'+a.dataUrl+'" alt="">';}).join('')+'</div>';}
      html+=docs.map(function(a){return '<span class="filechip">📄 '+esc(a.name)+'</span>';}).join('');
    }
    html+=fmt(text);
    var cost="";
    if(opts.usage){var u=opts.usage;var c="↑"+kfmt(u.in)+" ↓"+kfmt(u.out)+(typeof u.usd==="number"?" · ~"+usd(u.usd):"");cost='<span class="cost">'+c+'</span>';}
    html+='<div class="meta"><span class="ts">'+nowTs()+'</span>'+cost+'<button class="copy" title="Copy message">⧉</button></div>';
    b.innerHTML=html;
    b.querySelector(".copy").addEventListener("click",function(){copyText(text);});
    row.appendChild(b); log.appendChild(row); scroll(true);
    return b;
  }
  var typingRow=null;
  function showTyping(on){
    if(on){if(typingRow)return;typingRow=document.createElement("div");typingRow.className="row peh";
      typingRow.innerHTML='<div class="bubble" style="padding:0"><div class="typing"><span></span><span></span><span></span></div></div>';
      log.appendChild(typingRow);scroll(true);}
    else if(typingRow){typingRow.remove();typingRow=null;}
  }

  // ── attachments ──
  function downscale(file){
    return new Promise(function(res){
      if(!/^image\//.test(file.type)){ var r=new FileReader(); r.onload=function(){res(r.result);}; r.readAsDataURL(file); return; }
      var r=new FileReader();
      r.onload=function(){
        var img=new Image();
        img.onload=function(){
          var max=1568, w=img.width, h=img.height;
          if(w>max||h>max){var s=Math.min(max/w,max/h);w=Math.round(w*s);h=Math.round(h*s);}
          var cv=document.createElement("canvas");cv.width=w;cv.height=h;
          cv.getContext("2d").drawImage(img,0,0,w,h);
          res(cv.toDataURL("image/jpeg",0.85));
        };
        img.onerror=function(){res(r.result);};
        img.src=r.result;
      };
      r.readAsDataURL(file);
    });
  }
  function renderTray(){
    tray.innerHTML="";
    pending.forEach(function(a,i){
      var chip=document.createElement("div");chip.className="tchip";
      var inner=/^image\//.test(a.type)?'<img src="'+a.dataUrl+'">':'<span style="font-size:20px">📄</span>';
      chip.innerHTML=inner+'<span class="nm">'+esc(a.name)+'</span><span class="x" data-i="'+i+'">×</span>';
      chip.querySelector(".x").addEventListener("click",function(){pending.splice(i,1);renderTray();});
      tray.appendChild(chip);
    });
    tray.classList.toggle("on",pending.length>0);
  }
  $("attach").addEventListener("click",function(){fileInput.click();});
  fileInput.addEventListener("change",function(){
    var files=Array.prototype.slice.call(fileInput.files||[]);
    fileInput.value="";
    Promise.all(files.map(function(f){return downscale(f).then(function(url){return {name:f.name,type:f.type||"application/octet-stream",dataUrl:url};});}))
      .then(function(atts){ pending=pending.concat(atts); renderTray(); });
  });

  // ── model switcher ──
  function loadModels(){
    fetch(API+"/models",{headers:headers()}).then(function(r){return r.json();}).then(function(d){
      modelSel.innerHTML="";
      (d.available||[]).forEach(function(t){var o=document.createElement("option");o.value=t.id;o.textContent=t.label||t.id;if(d.active&&t.id===d.active.id)o.selected=true;modelSel.appendChild(o);});
    }).catch(function(){});
  }
  modelSel.addEventListener("change",function(){
    var id=modelSel.value;
    fetch(API+"/model",{method:"POST",headers:headers(),body:JSON.stringify({id:id})}).then(function(r){return r.json();})
      .then(function(d){ if(d&&d.ok){toast("Switched to "+(d.active&&d.active.model||id));refreshStatus();if(d.keyed===false)toast("⚠ no API key for "+(d.active&&d.active.key_kind));} else toast("Switch failed"+(d&&d.error?": "+d.error:"")); })
      .catch(function(){toast("Switch failed");});
  });

  function refreshStatus(){
    fetch(API+"/health",{headers:headers()}).then(function(r){return r.json();}).then(function(d){
      if(d.agent){AGENT=d.agent;agentNameEl.textContent=d.agent;avaEl.textContent=d.agent[0]||"P";document.title=d.agent+" — chat";}
      statusEl.textContent=(d.model||"online");
    }).catch(function(){statusEl.textContent="offline";});
  }

  // ── copy whole conversation ──
  $("copyAll").addEventListener("click",function(){
    if(!convo.length){toast("Nothing to copy");return;}
    var text=convo.map(function(m){return (m.who==="me"?"You":AGENT)+": "+m.text;}).join("\n\n");
    copyText(text);
  });

  // ── send ──
  function send(text){
    var atts=pending.slice();
    if(!text.trim() && !atts.length) return;
    addMsg("me", text||"(sent "+atts.length+" attachment"+(atts.length>1?"s":"")+")", {atts:atts});
    input.value=""; autosize(); pending=[]; renderTray(); sendBtn.disabled=true; showTyping(true);
    var body={message:text||"Please look at the attached file(s).",context:{roomId:ROOM}};
    if(atts.length)body.attachments=atts.map(function(a){return {name:a.name,type:a.type,data:a.dataUrl};});
    fetch(API+"/chat",{method:"POST",headers:headers(),body:JSON.stringify(body)})
      .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});})
      .then(function(res){
        showTyping(false);
        if(!res.ok && !res.j.content){ addMsg("peh", res.j.error||"Something went wrong.", {err:true}); }
        else { addMsg("peh", res.j.content||"…", {usage:res.j.usage}); }
      })
      .catch(function(e){ showTyping(false); addMsg("peh","Network error: "+e.message,{err:true}); })
      .finally(function(){ sendBtn.disabled=false; input.focus(); });
  }
  function autosize(){input.style.height="auto";input.style.height=Math.min(input.scrollHeight,140)+"px";}
  input.addEventListener("input",autosize);
  input.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();form.requestSubmit();}});
  form.addEventListener("submit",function(e){e.preventDefault();send(input.value);});

  refreshStatus(); loadModels();
  addSys("You're chatting with "+AGENT+" · room “"+ROOM+"” · history syncs to your lab");
  setInterval(refreshStatus, 30000);
  input.focus();
})();
</script>
</body>
</html>
