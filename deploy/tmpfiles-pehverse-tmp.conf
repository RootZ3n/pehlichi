# /etc/tmpfiles.d/pehverse-tmp.conf
#
# AUDIT H2 — /pehverse/tmp grows unbounded (3.1GB / 112K files and climbing): crash-leaked
# shadow workspaces, old test artifacts, and stale state from retired agents accumulate with
# no cleanup mechanism. Left alone it eventually fills the disk.
#
# This systemd-tmpfiles rule cleans files under /pehverse/tmp that have not been touched in
# 7 days. It is a SYSTEM configuration fix, not application code — DO NOT auto-install it.
#
# Deploy when ready:
#   sudo cp deploy/tmpfiles-pehverse-tmp.conf /etc/tmpfiles.d/pehverse-tmp.conf
#   sudo systemd-tmpfiles --clean /etc/tmpfiles.d/pehverse-tmp.conf   # dry-run-ish: applies the age rule once
#   # systemd's tmpfiles-clean.timer then runs it daily thereafter.
#
# Columns: Type Path Mode User Group Age
#   d = ensure the directory exists with the given owner/mode, and clean entries older than Age.
d /pehverse/tmp 0755 zen zen 7d
